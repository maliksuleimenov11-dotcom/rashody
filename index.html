<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои расходы</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
<main>
  <header><h1>Расходы<span class="brand-dot" aria-hidden="true">.</span></h1><p>Личный учёт расходов</p></header>
  <dialog id="expense-dialog" aria-labelledby="add-title">
    <div class="dialog-heading">
      <h2 id="add-title">Добавить трату</h2>
      <button id="close-expense" type="button" class="secondary dialog-close" aria-label="Закрыть окно добавления траты">×</button>
    </div>
    <form id="expense-form" novalidate>
      <div class="grid">
        <label>Сумма, ₸<input id="amount" inputmode="numeric" placeholder="Например, 5 000" required aria-describedby="form-error"></label>
        <label>Категория<select id="category" required></select></label>
      </div>
      <button id="toggle-category" type="button" class="secondary" aria-haspopup="dialog" aria-controls="category-dialog">Добавить категорию</button>
      <label>Дата<input id="date" type="date" required></label>
      <label>Комментарий <span class="muted">· необязательно</span><textarea id="comment" rows="2" maxlength="1000" placeholder="На что потратили?"></textarea></label>
      <p id="form-error" class="error" role="alert"></p>
      <button type="submit">Добавить трату</button>
    </form>
  </dialog>
  <dialog id="category-dialog" aria-labelledby="category-title">
    <div class="dialog-heading">
      <h2 id="category-title">Новая категория</h2>
      <button id="close-category" type="button" class="secondary dialog-close" aria-label="Закрыть окно новой категории">×</button>
    </div>
    <form id="category-form" novalidate>
      <label>Название<input id="new-category" maxlength="80" aria-describedby="category-error" placeholder="Например, Здоровье"></label>
      <p id="category-error" class="error" role="alert"></p>
      <div class="presets">
        <button id="save-category" type="submit">Создать</button>
        <button id="cancel-category" type="button" class="secondary">Отмена</button>
      </div>
    </form>
  </dialog>
  <section class="card total-card" aria-labelledby="total-title">
    <h2 id="total-title">Итог за текущий месяц</h2>
    <p id="total" class="total" aria-live="polite">0 ₸</p>
    <div class="grid">
      <label>С даты<input type="date" id="period-start"></label>
      <label>По дату<input type="date" id="period-end"></label>
    </div>
    <div id="presets" class="presets" aria-label="Быстрый выбор периода">
      <button type="button" class="secondary" data-days="1">Сутки</button>
      <button type="button" class="secondary" data-days="7">7 дней</button>
      <button type="button" class="secondary" data-days="14">14 дней</button>
      <button type="button" class="secondary" data-days="month">Месяц</button>
    </div>
    <p id="period-error" class="error" role="alert"></p>
  </section>
  <section class="card budget-card" aria-labelledby="budget-title">
    <p class="eyebrow">План и остаток</p>
    <h2 id="budget-title">Бюджет месяца</h2>
    <label>Месяц бюджета<input id="budget-month" type="month" required aria-describedby="budget-month-error"></label>
    <p id="budget-month-error" class="error" role="alert"></p>
    <div id="budget-summary" aria-live="polite">
      <p id="budget-total"></p>
      <p id="budget-spent"></p>
      <p id="budget-remaining"></p>
      <p id="budget-incomplete" class="muted"></p>
      <p id="budget-warning" class="budget-warning"></p>
    </div>
    <div id="budget-categories"></div>
  </section>
  <section class="card list-card" aria-labelledby="list-title">
    <div class="list-heading"><h2 id="list-title">Список трат</h2><button id="open-expense" type="button" aria-haspopup="dialog" aria-controls="expense-dialog">Добавить трату</button></div>
    <p id="status" class="muted" role="status"></p>
    <p id="empty" class="muted">Пока нет трат. Добавьте первую.</p><ul id="expenses"></ul>
  </section>
  <footer>Данные сохраняются в этом браузере</footer>
</main>
</body>
</html>
